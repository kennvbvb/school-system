name: CI

on:
  pull_request:
  push:
    branches: [main]

# ยกเลิกรอบเก่าเมื่อมี push ใหม่บน branch เดียวกัน เพื่อไม่ให้คิวยาวโดยเปล่าประโยชน์
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ค่าปลอมสำหรับ build/test เท่านั้น — ห้ามชี้ CI ไปที่ฐานข้อมูลจริง (ข้อ 17.1)
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  APP_TIMEZONE: Asia/Bangkok

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build ได้แม้ยังไม่ได้ตั้ง env (กัน prerender หน้าที่ต้องใช้ session)
        # Vercel deployment แรกล้มเพราะเหตุนี้: หน้าที่อ่าน session ถูก prerender
        # ตอน build แล้ว throw เพราะยังไม่มี env ทั้งที่หน้าเหล่านั้นควรเป็น dynamic
        #
        # ต้นเหตุคือลำดับการเรียกใน createSupabaseServerClient()
        # ถ้าตรวจ env ก่อนเรียก cookies() Next.js จะยังไม่รู้ว่า route เป็น dynamic
        #
        # step นี้ build ในสภาพที่ไม่มี env เลย ถ้ามีใครสลับลำดับกลับ CI จะจับได้ทันที
        run: |
          rm -rf .next
          env -u NEXT_PUBLIC_APP_URL \
              -u NEXT_PUBLIC_SUPABASE_URL \
              -u NEXT_PUBLIC_SUPABASE_ANON_KEY \
            npm run build

  migrations:
    name: Validate database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        # ยืนยันว่า migration ทั้งชุดรันบนฐานข้อมูลเปล่าได้จริง
        # และ seed ทั้งสองไฟล์รันตามลำดับได้โดยไม่ขัดกับ constraint ใด
        run: |
          supabase db start
          supabase db reset --no-seed
          DB_URL="$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed-reference.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed-sample.sql
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: ทดสอบ budget ledger บนฐานข้อมูลจริง
        # constraint, RLS, การล็อกแถว และ audit ที่เกิดในทรานแซกชันเดียวกับ movement
        # พิสูจน์ด้วย unit test ไม่ได้ ต้องรันบน PostgreSQL จริง
        run: supabase/tests/run-budget-tests.sh "$DB_URL"

      - name: ทดสอบรายการจัดซื้อบนฐานข้อมูลจริง
        # RLS ทั้งบวกและลบ, optimistic concurrency และที่สำคัญที่สุด —
        # ยอดที่ view คำนวณต้องตรงกับที่โดเมนคำนวณทุกสตางค์
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement_draft_test.sql

      - name: ทดสอบการสร้าง/บันทึกร่างแบบ atomic และการปิดเขียนตรง รวมบันทึกพร้อมกัน (F-08)
        # RPC เขียนแม่+ลูก+แหล่งเงิน+audit ใน transaction เดียว (failure injection ตรวจว่าล้มแล้วของเดิมครบ),
        # version เก่าถูกปฏิเสธ, เขียน procurements/รายการย่อย/แหล่งเงินตรงจาก authenticated ไม่ได้ทุกทาง
        # และบันทึกพร้อมกันด้วย version เดียวกันต้องสำเร็จเพียงหนึ่งคำขอ
        run: supabase/tests/run-draft-tests.sh "$DB_URL"

      - name: ทดสอบการส่งอนุมัติและกฎลำดับเวลาบนฐานข้อมูลจริง
        # จำลองข้อผิดพลาดจากไฟล์จริง (F-02, F-03, F-04) และพิสูจน์ว่าการเรียก RPC
        # ตรงโดยไม่ผ่านหน้าจอก็ถูกปฏิเสธเหมือนกัน
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement_submit_test.sql

      - name: ทดสอบสายอนุมัติบนฐานข้อมูลจริง
        # separation of duties, ประวัติที่แช่แข็งไว้ และการที่สถานะกับประวัติ
        # เปลี่ยนพร้อมกันหรือไม่เปลี่ยนเลย พิสูจน์ด้วย unit test ไม่ได้
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement_transition_test.sql

      - name: ทดสอบทะเบียนผู้ขายบนฐานข้อมูลจริง
        # กฎ BLOCK ของผู้ขายซ้ำถูกบังคับด้วย unique index ไม่ใช่ด้วย TypeScript
        # และ "ไม่ระบุสาขา" ต้องแปลว่าสาขา 00000 เหมือนที่ชั้นโดเมนแปลง
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/vendor_registry_test.sql

      - name: ทดสอบทะเบียนเลขที่เอกสารบนฐานข้อมูลจริง
        # เลขไทยกับเลขอารบิกที่ค่าเท่ากันต้องถือว่าซ้ำ (F-12) และเลขที่ยกเลิกแล้ว
        # ต้องนำกลับมาใช้ไม่ได้ — ทั้งสองข้อบังคับด้วย unique index ไม่ใช่ TypeScript
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/document_number_test.sql

      - name: ทดสอบการกันยอดงบตอนอนุมัติบนฐานข้อมูลจริง
        # ชุดที่สองอนุมัติสองรายการพร้อมกันด้วยสอง session — พิสูจน์ว่าสองรายการ
        # ที่รวมกันเกินงบอนุมัติสำเร็จได้เพียงรายการเดียว ซึ่งเขียนใน .sql ไฟล์เดียวไม่ได้
        run: supabase/tests/run-reservation-tests.sh "$DB_URL"

      - name: ทดสอบการจัดการผู้ใช้และสิทธิ์บนฐานข้อมูลจริง
        # กฎที่สำคัญที่สุดคือ "ต้องเหลือผู้ดูแลอย่างน้อยหนึ่งคนเสมอ" — ถ้าพลาด
        # จะไม่มีใครแก้สิทธิ์ได้อีกเลยนอกจากเข้าฐานข้อมูลตรง ซึ่งโรงเรียนทำเองไม่ได้
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/user_administration_test.sql

      - name: ทดสอบการเบิกจ่ายบนฐานข้อมูลจริง
        # จ่ายแล้วยอดที่ใช้ได้ต้องไม่ขยับ เพราะ RELEASE กับ ACTUAL ลงคู่กัน
        # และจ่ายจนครบแล้วยอดที่กันไว้ต้องเหลือศูนย์ — ปิดอาการ "กันไว้ตลอดกาล"
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement_disbursement_test.sql

      - name: ทดสอบการอ่าน audit log บนฐานข้อมูลจริง
        # ผู้ไม่มีสิทธิ์ audit.read ต้องมองไม่เห็นแม้แต่แถวเดียว และแถวที่เวลา
        # เท่ากันต้องไม่ถูกข้ามตอนแบ่งหน้า — ประวัติที่หายไปเงียบ ๆ ยอมไม่ได้
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/audit_read_test.sql

      - name: ทดสอบการผูกพันงบตอนออกใบสั่งซื้อบนฐานข้อมูลจริง
        # ออกใบสั่งซื้อแล้วยอดที่ใช้ได้ต้องไม่ขยับ แต่ยอดย้ายจาก "กันไว้" ไป "ผูกพัน"
        # และผู้กดต้องทำได้แม้ไม่มี budget.manage เพราะเป็นเจ้าหน้าที่พัสดุ
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement_commitment_test.sql

      - name: ทดสอบฟังก์ชันรวมยอดงบสำหรับรายงานบนฐานข้อมูลจริง
        # ยอดที่รายงานคืนต้องตรงกับ view budget_account_balances ทุกบัญชี
        # และบัญชีที่ยังไม่มีรายการหรือไม่ได้ผูกโครงการต้องไม่หายไปจากผลลัพธ์
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/budget_report_test.sql

      - name: ทดสอบฟังก์ชันทะเบียนจัดซื้อจัดจ้างบนฐานข้อมูลจริง
        # ขอบเขตแถวต้องมาจาก RLS ไม่ใช่จากหน้าจอ — ผู้ที่มีเพียง read.own
        # ต้องเห็นเฉพาะรายการของตนแม้จะเรียก RPC ตรง และยอดต้องตรงกับ
        # view procurement_totals ทุกแถว
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement_register_test.sql

      - name: ทดสอบรายงานสถานะเอกสารบนฐานข้อมูลจริง
        # เลขที่ยกเลิกแล้วและเลขของรายการที่ถูกลบต้องไม่นับเป็นช่องว่าง
        # และช่วงเลขที่กว้างผิดปกติต้องไม่ทำให้ query ระเบิด
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/document_status_test.sql

      - name: ทดสอบ trusted RPC ของ audit log บนฐานข้อมูลจริง (PR-S01)
        # insert ตรงเข้า audit_events ต้องถูกปฏิเสธเสมอ และ actor_id ต้องมาจาก
        # auth.uid() ของผู้เรียกจริงเท่านั้น — ปิดช่องที่ผู้ใช้หนึ่งเคยปลอม
        # actor_id เป็นอีกคนได้ผ่าน Supabase REST API ตรง ข้าม Next.js ทั้งหมด
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/audit_trusted_rpc_test.sql

      - name: ทดสอบความครบของทะเบียนที่ขอบเขต 999/1000/1001 และ 4999/5000/5001 (F-01)
        # ฐานข้อมูลต้องบอก total_count เองใน snapshot เดียวกับแถว — ขอ limit+1 แล้วเดาตัดสินไม่ได้
        # เพราะ SQL clamp ที่ 5,000 (ชั้น HTTP/PostgREST max_rows พิสูจน์ใน job register-http)
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement_register_completeness_test.sql

      - name: ทดสอบ view/ฟังก์ชันอ่านไม่ข้ามสิทธิ์ และ anon ไม่มีสิทธิ์ใน public (F-06)
        # view ต้องเป็น security_invoker ให้ RLS ของผู้เรียกบังคับ, budget_available/stock_on_hand เรียกตรงไม่ได้
        # และตรวจทั้ง schema ว่า anon ไม่มี execute ฟังก์ชันใดเลย — บน Supabase จริง anon ได้ execute เป็นค่าเริ่มต้น
        # ฟังก์ชันที่เพิ่มภายหลังแล้วลืม revoke จึงทำให้ step นี้แดง
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/view_read_boundary_test.sql

      - name: ทดสอบ ledger คลังพัสดุบนฐานข้อมูลจริง รวมลงรายการพร้อมกัน (F-02/F-03/F-04)
        # ลำดับ ledger มาจาก sequence_no ไม่ใช่ now()/UUID, ย้อนรายการต้องตรงต้นทางทั้งรายการและจำนวน
        # (ตรวจในฐานข้อมูล ไม่ใช่แค่ server action), รับเข้าครั้งแรกจากศูนย์ได้โดยไม่ต้องมียอดยกมา
        # และคำขอพร้อมกันหลาย session ต้องไม่ทำให้ลำดับชนหรือยอดติดลบ
        run: supabase/tests/run-inventory-tests.sh "$DB_URL"

      - name: ทดสอบรายชื่อผู้เบิก/ผู้อนุมัติและอำนาจผู้อนุมัติของคลัง (F-05)
        # ผู้อนุมัติต้อง active และถือ inventory.approve, ผู้เบิกต้อง active, ผู้เบิกกับผู้อนุมัติต้องเป็นคนละคน
        # ตรวจในฐานข้อมูล — เรียก RPC ตรงก็เลี่ยงไม่ได้; รายชื่อคืนเฉพาะคอลัมน์ที่จำเป็นและ anon เรียกไม่ได้
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/inventory_staff_approval_test.sql

  register-http:
    name: Register completeness through PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (API + Auth + database)
        # ชั้น HTTP ต้องมี PostgREST/GoTrue/gateway จริง — `supabase db start` ในอีก job มีแต่ฐานข้อมูล
        # max_rows ของ PostgREST (config.toml = 1,000) ตัดแถวก่อนถึงแอป SQL ตรง ๆ จึงไม่เห็นเพดานนี้
        run: |
          # config.toml ตั้ง [auth.email] enable_signup = false ซึ่ง Supabase CLI แปลเป็น "ปิดผู้ให้บริการอีเมลทั้งหมด"
          # (GoTrue ตอบ email_provider_disabled: Email logins are disabled) ทำให้ผู้ใช้ทดสอบ sign in
          # ด้วยรหัสผ่านไม่ได้ — เปิดเฉพาะสำเนาใน runner นี้ ไม่แก้ไฟล์ใน repo; การสมัครสาธารณะยังปิดด้วย [auth] enable_signup = false
          sed -i '/^\[auth\.email\]/,/^$/ s/^enable_signup = false/enable_signup = true/' supabase/config.toml
          grep -A1 '^\[auth\.email\]' supabase/config.toml
          supabase start
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          for key in API_URL DB_URL ANON_KEY SERVICE_ROLE_KEY; do
            grep -q "^$key=" "$RUNNER_TEMP/supabase.env" || { echo "supabase status ไม่มี $key"; exit 1; }
          done

      - name: ทดสอบทะเบียนครบ/ถูกตัดผ่าน PostgREST จริง (F-01)
        # ผู้ใช้ทดสอบสร้างผ่าน GoTrue แล้วเรียก RPC ด้วย JWT จริง ที่ 999/1000/1001 และ 4999/5000/5001 แถว
        run: |
          get() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          # `supabase start` รัน seed ตาม config.toml ให้แล้ว (บทบาท/สิทธิ์) — เติมเฉพาะเมื่อยังไม่มี
          if [ "$(psql "$(get DB_URL)" -t -A -c 'select count(*) from public.roles')" = "0" ]; then
            psql "$(get DB_URL)" -v ON_ERROR_STOP=1 -f supabase/seed-reference.sql
          fi
          supabase/tests/run-register-http-tests.sh \
            "$(get DB_URL)" "$(get API_URL)" "$(get ANON_KEY)" "$(get SERVICE_ROLE_KEY)"

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        # ตั้ง PLAYWRIGHT_BASE_URL เป็น URL ของ Vercel Preview เพื่อทดสอบกับ deployment จริง
        # ถ้าไม่ตั้ง Playwright จะ build แล้วยกเซิร์ฟเวอร์ขึ้นเองใน runner
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
