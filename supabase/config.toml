# ค่าตั้ง Supabase local development
# เอกสารอ้างอิง: https://supabase.com/docs/guides/local-development
project_id = "school-procurement-system"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# PostgREST ตัดจำนวนแถวของ set-returning function ที่เพดานนี้ก่อนถึงแอป — ห้ามใช้จำนวนแถวที่ได้
# ตัดสินว่า "ครบ" ทะเบียนจึงคืน jsonb ค่าเดียว { total_count, rows } (ดู migration 20261006000200)
max_rows = 1000

[db]
port = 54322
major_version = 17

# seed แบ่งเป็นสองไฟล์และต้องรันตามลำดับนี้
#   seed-reference.sql = ข้อมูลบังคับที่ผูกกับโค้ด รันทุก environment
#   seed-sample.sql    = ข้อมูลสมมติ รันเฉพาะ local และ preview
# Production ไม่ได้ใช้ค่านี้ เพราะรัน SQL เองตาม docs/setup-supabase-vercel.md
[db.seed]
enabled = true
sql_paths = ["./seed-reference.sql", "./seed-sample.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# ขนาดไฟล์แนบสูงสุด — ต้องสอดคล้องกับการตรวจฝั่ง server (ข้อ 14.1)
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/reset-password",
]
# ต้องไม่ต่ำกว่า PASSWORD_MIN_LENGTH ใน src/domain/auth/password.ts — ตัวบังคับจริงคือค่านี้
# ไม่ใช่ฟอร์ม (บนคลาวด์ตั้งที่ Dashboard ด้วยมือ ดู docs/setup-supabase-vercel.md)
minimum_password_length = 12
jwt_expiry = 3600
enable_refresh_token_rotation = true

# FR-AUTH-002 — ปิดการสมัครสมาชิกสาธารณะ ผู้ดูแลเป็นผู้สร้างบัญชีเท่านั้น
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
